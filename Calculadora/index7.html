<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
<div id="calculadora">
    <h1>Calculadora</h1>
    
    <input type="text" id="display" readonly>
    
    <div class="botones">
        <input type="button" value="7" onclick="AgregarPantalla(this.value)">   
        <input type="button" value="8" onclick="AgregarPantalla(this.value)">
        <input type="button" value="9" onclick="AgregarPantalla(this.value)">
        <input type="button" value="/" onclick="AgregarPantalla(this.value)">

        <input type="button" value="4" onclick="AgregarPantalla(this.value)">
        <input type="button" value="5" onclick="AgregarPantalla(this.value)">        
        <input type="button" value="6" onclick="AgregarPantalla(this.value)">
        <input type="button" value="*" onclick="AgregarPantalla(this.value)">

        <input type="button" value="1" onclick="AgregarPantalla(this.value)">
        <input type="button" value="2" onclick="AgregarPantalla(this.value)">            
        <input type="button" value="3" onclick="AgregarPantalla(this.value)">
        <input type="button" value="-" onclick="AgregarPantalla(this.value)">

        <input type="button" value="C" onclick="limpiarPantalla()">            
        <input type="button" value="0" onclick="AgregarPantalla(this.value)">
        <input type="button" value="=" onclick="calcularResultado()">
        <input type="button" value="+" onclick="AgregarPantalla(this.value)">
    </div>
</div>
</body>
<script src="app12.js"></script>
</html>
